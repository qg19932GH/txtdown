name: Build EXE

on:
  push:
    paths:
      - 'main.py'
      - 'xchina_downloader.py'
      - 'xphoto_downloader.py'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cloudscraper pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name txtdown main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: txtdown-windows
          path: dist/txtdown.exe
