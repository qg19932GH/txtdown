name: Build xphoto EXE

on:
  push:
    paths:
      - 'xphoto_downloader.py'
      - '.github/workflows/build-xphoto.yml'
      - 'requirements_xphoto.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cloudscraper pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name xphoto_downloader xphoto_downloader.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xphoto_downloader-windows
          path: dist/xphoto_downloader.exe
